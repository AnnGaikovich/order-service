apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 80
    targetPort: 8082
    protocol: TCP
  - name: actuator
    port: 8083
    targetPort: 8083
    protocol: TCP
  type: ClusterIP