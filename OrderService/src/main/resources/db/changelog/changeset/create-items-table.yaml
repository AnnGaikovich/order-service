databaseChangeLog:
  - changeSet:
      id: create-items-table
      author: Anna Gaikovich
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_item_name
            tableName: items
            columns:
              - column:
                  name: name

        - createIndex:
            indexName: idx_item_created_at
            tableName: items
            columns:
              - column:
                  name: created_at