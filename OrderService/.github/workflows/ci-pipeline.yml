name: CI Pipeline for OrderService

on:
  push:
    branches: [ main, order-service ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: order_service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run tests with coverage
        run: mvn clean verify jacoco:report
        env:
          DB_URL: jdbc:postgresql://localhost:5432/order_service_db
          DB_USERNAME: postgres
          DB_PASSWORD: 123456
          SERVER_PORT: 8081
          USER_SERVICE_URL: http://localhost:8080
          USER_SERVICE_API_KEY: internal-auth-key-12345

      - name: Run integration tests (optional)
        if: success()
        run: |
          if [ -f "src/test/resources/application-integration.yml" ]; then
            mvn verify -Pintegration-tests \
              -Dspring.profiles.active=integration \
              -DDB_URL=jdbc:postgresql://localhost:5432/order_service_db \
              -DDB_USERNAME=postgres \
              -DDB_PASSWORD=123456
          else
            echo "No integration tests configuration found"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t orderservice:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d \
            --name order-service-test \
            -p 8081:8081 \
            -e DB_URL=jdbc:postgresql://localhost:5432/order_service_db \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=123456 \
            orderservice:${{ github.sha }
          
          sleep 20
          
          curl -f http://localhost:8081/actuator/health || exit 1
          
          docker stop order-service-test
          docker rm order-service-test

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag orderservice:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:${{ github.sha }}
          docker tag orderservice:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/orderservice:latest

      - name: Push to GitHub Container Registry (Alternative)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag orderservice:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag orderservice:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}